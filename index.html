<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 폰트 서버 연결을 미리 데워두고(preconnect), CSS @import 대신 <link>로 불러와
         HTML 파싱 중 즉시 다운로드를 시작한다(첫 화면 한글이 더 빨리 렌더링됨). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@500;600;700;900&display=swap"
    />
    <script>
      // 스크롤에 따라 입구 연출/부팅/전환 상태가 결정되는 페이지라, 브라우저의
      // 기본 스크롤 복원(특히 모바일)이 새로고침 직후 중간 스크롤 위치를 되돌려
      // 놓으면 클릭으로만 켜지는 activated/booting 같은 상태와 어긋나 화면이
      // 깨진 것처럼 보인다. 새로고침은 항상 맨 위에서 시작하도록 강제한다.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Silock에서 구매한 디지털 출판 콘텐츠를 서비스 종료 이후에도 오래 소장할 수 있도록 설계하는 오픈 마켓플레이스" />
    <title>Silock</title>

    <!-- Open Graph / 카카오톡·페이스북 등 소셜 미리보기.
         소셜 크롤러는 JS를 실행하지 않으므로 반드시 정적 HTML(여기)에 있어야 하고,
         og:image·og:url은 상대경로가 아닌 절대경로(https://...)여야 한다.
         ▼ 실제 배포 도메인이 다르면 아래 두 줄의 도메인만 바꾸면 된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Silock" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Silock" />
    <meta property="og:description" content="Silock에서 구매한 디지털 출판 콘텐츠를 서비스 종료 이후에도 오래 소장할 수 있도록 설계하는 오픈 마켓플레이스" />
    <meta property="og:url" content="https://silock-demo.vercel.app/" />
    <meta property="og:image" content="https://silock-demo.vercel.app/open_graph.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Silock" />

    <!-- 트위터(X) 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Silock" />
    <meta name="twitter:description" content="Silock에서 구매한 디지털 출판 콘텐츠를 서비스 종료 이후에도 오래 소장할 수 있도록 설계하는 오픈 마켓플레이스" />
    <meta name="twitter:image" content="https://silock-demo.vercel.app/open_graph.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
